name: 构建 APK 与 IPA

# 每次分支推送：
#  - android job：release APK（R8 + 仅 ARM ABI，固定密钥签名）
#  - ios job：iOS 模拟器用未签名 IPA（KMP framework + Xcode 构建，无需 Apple 开发者账号）
#  两个产物统一进一份 prerelease。

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    outputs:
      stamp: ${{ steps.stamp.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: 还原签名密钥（keystore + keystore.properties）
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::RELEASE_KEYSTORE_B64 未配置：仓库 Secrets 里需要 keystore 的 base64 与密码"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > zcode-mobile-release.keystore
          cat > keystore.properties <<EOF
          storeFile=zcode-mobile-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=zcode-mobile
          keyPassword=$KEYSTORE_PASSWORD
          EOF
          # 同一份密钥才能覆盖安装，这里校验解码结果确实是合法 keystore
          keytool -list -keystore zcode-mobile-release.keystore \
            -storepass "$KEYSTORE_PASSWORD" -alias zcode-mobile >/dev/null

      - name: 构建时间戳（东八区；APK 名与 tag 共用）
        id: stamp
        run: echo "value=$(TZ=Asia/Shanghai date +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

      - name: 构建 release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :protocol:jvmTest :shared:allTests :app:testDebugUnitTest --stacktrace

      - name: 校验签名并按时间戳重命名
        id: apk
        env:
          STAMP: ${{ steps.stamp.outputs.value }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APK="zcode_mobile_ci_${STAMP}.apk"
          "$BT/apksigner" verify app/build/outputs/apk/release/app-release.apk
          mv app/build/outputs/apk/release/app-release.apk "$APK"
          ls -lh "$APK"
          echo "name=$APK" >> "$GITHUB_OUTPUT"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # iOS 编译期校验：先单独跑一遍 KMP iOS 目标编译（klib + framework），
      # 让 Kotlin 编译错误在这一步就暴露，而不是藏在 xcodebuild 里。
      - name: 编译 KMP iOS 目标
        run: |
          chmod +x gradlew
          ./gradlew :shared:linkReleaseFrameworkIosSimulatorArm64 :protocol:compileKotlinIosArm64 --stacktrace

      - name: 构建时间戳（与 android job 同规则）
        id: stamp
        run: echo "value=$(TZ=Asia/Shanghai date +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

      # 模拟器目的地的未签名构建（generic 不行——模拟器 framework 只在
      #iphonesimulator SDK 下产出）。产物是 .app，随后打包成可分发的 IPA。
      - name: 调试 framework header
        run: |
          FW=shared/build/bin/iosSimulatorArm64/releaseFramework/ZcodeShared.framework
          sed -n '1076,1092p' "$FW/Headers/ZcodeShared.h" || true

      - name: Xcode 构建未签名模拟器 app
        run: |
          set -euo pipefail
          cd iosApp
          xcodebuild -project ZcodeMobile.xcodeproj -scheme ZcodeMobile \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | tail -40
          APP="build/Build/Products/Release-iphonesimulator/ZcodeMobile.app"
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          IPA="zcode_mobile_ci_${{ steps.stamp.outputs.value }}.ipa"
          zip -qry "$IPA" Payload
          rm -rf Payload
          mv "$IPA" "$GITHUB_WORKSPACE/"
          echo "IPA=$IPA" >> "$GITHUB_ENV"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA }}
          path: ${{ env.IPA }}
          if-no-files-found: error

  release:
    needs: [android, ios]
    runs-on: ubuntu-latest
    if: always() && needs.android.result == 'success' && needs.ios.result == 'success'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 发布 prerelease（APK + IPA）
        env:
          GH_TOKEN: ${{ github.token }}
          STAMP_ANDROID: ${{ needs.android.outputs.stamp }}
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          ls -lh artifacts
          # 时间戳取 android job 的（ios 用同一规则，同分钟内一致）
          STAMP=$(ls artifacts/zcode_mobile_ci_*.apk | head -1 | grep -oE '[0-9]{12}')
          TAG="ci-${STAMP}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            TAG="ci-${STAMP}-${GITHUB_SHA::7}"
          fi

          # 提交信息经 printf 注入，避免反引号/$ 被展开
          SUBJECT=$(printf '%s' "${COMMIT_SUBJECT:-}" | head -n 1)
          [ -n "$SUBJECT" ] || SUBJECT="(无提交信息)"

          {
            echo "自动构建的尝鲜版本（prerelease），未经充分测试。"
            echo
            echo "- 分支: ${GITHUB_REF_NAME}"
            printf -- "- 提交: %s %s\n" "${GITHUB_SHA::7}" "$SUBJECT"
            echo "- APK：仅含 ARM ABI（arm64-v8a / armeabi-v7a），适用于真机，固定密钥签名，可直接覆盖安装"
            echo "- IPA：iOS 模拟器专用未签名包（解压后拖入模拟器安装），真机安装需要自行签名"
          } > notes.md

          gh release create "$TAG" artifacts/zcode_mobile_ci_* \
            --prerelease \
            --title "zcode_mobile_ci_${STAMP}" \
            --notes-file notes.md
